name: Apply mobile app layout fix

on:
  push:
    branches: ["agent/mobile-app-layout-fix"]
    paths:
      - ".mobile-deploy/**"
      - ".github/workflows/apply-mobile-app-fix.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out mobile branch
        uses: actions/checkout@v4
        with:
          ref: agent/mobile-app-layout-fix
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Reconstruct mobile package
        shell: bash
        run: |
          set -euo pipefail
          test "$(find .mobile-deploy -maxdepth 1 -name 'chunk-*.b64' | wc -l)" -eq 3
          LC_ALL=C cat .mobile-deploy/chunk-*.b64 > /tmp/mobile-package.b64
          base64 --decode /tmp/mobile-package.b64 > /tmp/mobile-package.zip
          echo "288864f5b8847b19d9956168d22851ada92dabb24ce2b2b67a33b6ee0fb1f74c  /tmp/mobile-package.zip" | sha256sum -c -
          unzip -t /tmp/mobile-package.zip
          unzip -o /tmp/mobile-package.zip -d .

      - name: Build and validate
        run: |
          node build-site-css.mjs
          node validate-site.mjs

      - name: Commit mobile application files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .mobile-deploy
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile-app.css mobile-studio.js index.html privacy.html terms.html refunds.html delivery.html thank-you.html validate-site.mjs
          git add -A .mobile-deploy
          if git diff --cached --quiet; then
            echo "No mobile changes to commit."
            exit 0
          fi
          git commit -m "Fix mobile clipping with full-screen studio"
          git push origin HEAD:agent/mobile-app-layout-fix
