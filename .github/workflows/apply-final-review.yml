name: Apply final reviewed deployment

on:
  push:
    branches: ["agent/final-reviewed-deployment"]
    paths:
      - ".review-deploy/**"
      - ".github/workflows/apply-final-review.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out review branch
        uses: actions/checkout@v4
        with:
          ref: agent/final-reviewed-deployment
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Reconstruct reviewed package
        id: staged
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d .review-deploy ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "No staged archive remains; nothing to apply."
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
          test "$(find .review-deploy -maxdepth 1 -name 'chunk-*.b64' | wc -l)" -eq 13
          LC_ALL=C cat .review-deploy/chunk-*.b64 > /tmp/review-package.b64
          base64 --decode /tmp/review-package.b64 > /tmp/review-package.zip
          echo "b8854cb2c1125d44ec5672c0299c797269da7be326d423c47d3ca6b447a5b94f  /tmp/review-package.zip" | sha256sum -c -
          unzip -o /tmp/review-package.zip -d .

      - name: Build and validate
        if: steps.staged.outputs.ready == 'true'
        run: |
          node build-site-css.mjs
          node validate-site.mjs

      - name: Commit reviewed application files
        if: steps.staged.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # GitHub's Actions token cannot change workflow files. The connected
          # GitHub app applies the reviewed Pages workflow in the next step.
          git checkout -- .github/workflows/pages.yml
          rm -rf .review-deploy
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No application changes to commit."
            exit 0
          fi
          git commit -m "Complete design and performance review"
          git push origin HEAD:agent/final-reviewed-deployment
