name: Apply commerce upgrade

on:
  push:
    branches: [main]
    paths:
      - ".bootstrap/commerce-upgrade/part-*"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore commerce source
        shell: bash
        run: |
          set -euo pipefail
          if ! compgen -G ".bootstrap/commerce-upgrade/part-*" > /dev/null; then
            echo "Upgrade archive already applied."
            exit 0
          fi
          cat .bootstrap/commerce-upgrade/part-* > /tmp/upgrade.b64
          base64 --decode /tmp/upgrade.b64 > /tmp/upgrade.tar.gz
          echo "27fa796e66ad16174ec01a08b2a2c15b2f6ba420090a783d0b00257eb9edd572  /tmp/upgrade.tar.gz" | sha256sum -c -
          tar -tzf /tmp/upgrade.tar.gz > /dev/null
          tar -xzf /tmp/upgrade.tar.gz -C .
          rm -rf .bootstrap/commerce-upgrade

      - name: Commit commerce upgrade
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Add search cart and checkout flow"
          git push
