name: Apply complete website redesign

on:
  push:
    branches: ["agent/complete-website-redesign"]
    paths:
      - ".redesign-deploy/**"
      - ".github/workflows/apply-complete-redesign.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out redesign branch
        uses: actions/checkout@v4
        with:
          ref: agent/complete-website-redesign
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Reconstruct redesign package
        id: staged
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d .redesign-deploy ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "No staged redesign archive remains; nothing to apply."
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
          test "$(find .redesign-deploy -maxdepth 1 -name 'chunk-*.b64' | wc -l)" -eq 5
          LC_ALL=C cat .redesign-deploy/chunk-*.b64 > /tmp/redesign-package.b64
          base64 --decode /tmp/redesign-package.b64 > /tmp/redesign-package.zip
          echo "001ecf9207e69d772704e7e34b57e1e3ba8c4ab22c966c4b14276966dff37f2a  /tmp/redesign-package.zip" | sha256sum -c -
          unzip -o /tmp/redesign-package.zip -d .

      - name: Build and validate
        if: steps.staged.outputs.ready == 'true'
        run: |
          node build-site-css.mjs
          node validate-site.mjs

      - name: Commit redesigned application files
        if: steps.staged.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .redesign-deploy
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No redesign changes to commit."
            exit 0
          fi
          git commit -m "Replace website with complete product-gallery redesign"
          git push origin HEAD:agent/complete-website-redesign
